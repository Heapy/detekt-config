tasks:
  detekt:
    action: !io.heapy.detekt.plugin.runDetekt
      sources: ${module.kotlinJavaSources}
      compileClasspath: ${module.compileClasspath}
      detektClasspath:
        - dev.detekt:detekt-cli:2.0.0-alpha.6
        - dev.detekt:detekt-rules-ktlint-wrapper:2.0.0-alpha.6
        - io.heapy.detekt:the-config:0.1.0
      moduleRootDir: ${module.rootDir}
      jvmTarget: ${module.settings.jvm.release}
      configResource: /heapy/detekt.yml
      configOverride: ${pluginSettings.configOverride}
      extractedConfigDir: ${taskOutputDir}

checks:
  - detekt
