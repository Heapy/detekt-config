product: jvm/lib

dependencies:
  # The @AllowSuppress annotation. SOURCE retention, so nothing reaches the jar.
  - ../the-config: compile-only

# The plugin resolves the versioned artifact, so pre-release checks use the candidate
# published locally by `./kotlin publish mavenLocal -m the-config`.
repositories:
  - mavenLocal

plugins:
  heapy-detekt:
    enabled: true
    # Merged on top of the config in the published jar, so this repository lints
    # against its own working tree. A key deleted here still comes from the jar
    # until the next release.
    configOverride: //the-config/resources/heapy/detekt.yml
