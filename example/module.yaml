product: jvm/lib

dependencies:
  # The @HeapySuppress annotation. SOURCE retention, so nothing reaches the jar.
  - ../the-config: compile-only

plugins:
  heapy-detekt:
    enabled: true
    # Merged on top of the config in the published jar, so this repository lints
    # against its own working tree. A key deleted here still comes from the jar
    # until the next release.
    configOverride: //the-config/resources/heapy/detekt.yml
