product: jvm/lib

dependencies:
  # The @HeapySuppress annotation. SOURCE retention, so nothing reaches the jar.
  - ../the-config: compile-only

plugins:
  heapy-detekt:
    enabled: true
    # This repository has no root detekt.yml: the config lives in the module that
    # ships it. Consumers keep the default, which is the project root.
    configFile: //the-config/resources/heapy/detekt.yml
