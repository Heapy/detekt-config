# Heapy shared detekt configuration.
# Base: default config of detekt 2.0.0-alpha.6 (detekt-cli --generate-config),
# plus the 'ktlint' formatting rules from detekt-rules-ktlint-wrapper.
# Every deviation from the default is marked with a "# HEAPY:" comment.
# Installed by install.sh from Heapy/detekt-config; do not edit in place.

config:
  validation: true
  warningsAsErrors: true # HEAPY: default false; CI is a gate, all findings fail the build
  checkExhaustiveness: true # HEAPY: default false; a rule added by a detekt upgrade must be configured here
  excludes: []

processors:
  active: true
  exclude:

console-reports:
  active: true
  exclude:
     - 'ProjectStatisticsReport'
     - 'ComplexityReport'
     - 'NotificationReport'
     - 'IssuesReport'
     - 'FileBasedIssuesReport'

comments:
  active: true
  AbsentOrWrongFileLicense:
    active: false
    licenseTemplateIsRegex: false
    licenseTemplate: ''
  DeprecatedBlockTag:
    active: false
  DocumentationOverPrivateFunction:
    active: false
  DocumentationOverPrivateProperty:
    active: false
  EndOfSentenceFormat:
    active: false
    endOfSentenceFormat: '([.?!][ \t\n\r\f<])|([.?!:]$)'
  KDocReferencesNonPublicProperty:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
  OutdatedDocumentation:
    active: false
    matchTypeParameters: true
    matchDeclarationsOrder: true
    allowParamOnConstructorProperties: false
    exhaustive: true
  UndocumentedPublicClass:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    searchInNestedClass: true
    searchInInnerClass: true
    searchInInnerObject: true
    searchInInnerInterface: true
    searchInProtectedClass: false
    ignoreDefaultCompanionObject: false
  UndocumentedPublicFunction:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    searchProtectedFunction: false
  UndocumentedPublicProperty:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    searchProtectedProperty: false
    ignoreEnumEntries: false

complexity:
  active: true
  CognitiveComplexMethod:
    active: true # HEAPY: default false; cognitive complexity reflects readability better than cyclomatic
    allowedComplexity: 15
  ComplexCondition:
    active: true
    allowedConditions: 3
  ComplexInterface:
    active: false
    allowedDefinitions: 10
    includeStaticDeclarations: false
    includePrivateDeclarations: false
    ignoreOverloaded: false
  CyclomaticComplexMethod:
    active: true
    allowedComplexity: 14
    ignoreSingleWhenExpression: false
    ignoreSimpleWhenEntries: false
    ignoreNestingFunctions: false
    ignoreLocalFunctions: false
    nestingFunctions:
      - 'also'
      - 'apply'
      - 'forEach'
      - 'isNotNull'
      - 'ifNull'
      - 'let'
      - 'run'
      - 'use'
      - 'with'
  LabeledExpression:
    active: true # HEAPY: default false; bans 'return@label', and every other label with it
    ignoredLabels: []
  LargeClass:
    active: true
    allowedLines: 600
  LongMethod:
    active: true
    allowedLines: 60
  LongParameterList:
    active: true
    allowedFunctionParameters: 5
    allowedConstructorParameters: 6
    ignoreDefaultParameters: false
    ignoreDataClasses: true
    ignoreAnnotatedParameter: []
  MethodOverloading:
    active: false
    allowedOverloads: 6
  NamedArguments:
    active: true # HEAPY: default false
    allowedArguments: 2 # HEAPY: default 3
    ignoreMethods: []
    ignoreArgumentsMatchingNames: false
  NestedBlockDepth:
    active: true
    allowedDepth: 4
  NestedScopeFunctions:
    active: false
    allowedDepth: 1
    functions:
      - 'kotlin.apply'
      - 'kotlin.run'
      - 'kotlin.with'
      - 'kotlin.let'
      - 'kotlin.also'
  ReplaceSafeCallChainWithRun:
    active: false
  StringLiteralDuplication:
    active: false
    excludes: ['**/test/**', '**/androidTest/**', '**/commonTest/**', '**/jvmTest/**', '**/androidUnitTest/**', '**/androidInstrumentedTest/**', '**/jsTest/**', '**/iosTest/**']
    allowedDuplications: 2
    ignoreAnnotation: true
    allowedWithLengthLessThan: 5
    ignoreStringsRegex: '$^'
  TooManyFunctions:
    active: true
    excludes: [] # HEAPY: default excludes test sources; tests are held to the same rule
    allowedFunctionsPerFile: 11
    allowedFunctionsPerClass: 11
    allowedFunctionsPerInterface: 11
    allowedFunctionsPerObject: 11
    allowedFunctionsPerEnum: 11
    ignoreDeprecated: false
    ignorePrivate: false
    ignoreInternal: false
    ignoreOverridden: false
    ignoreAnnotatedFunctions: []

coroutines:
  active: true
  CoroutineLaunchedInTestWithoutRunTest:
    active: true # HEAPY: default false; the test passes without awaiting the coroutine
  GlobalCoroutineUsage:
    active: true # HEAPY: default false; GlobalScope hides coroutine lifecycle, use structured concurrency
  InjectDispatcher:
    active: true
    dispatcherNames:
      - 'IO'
      - 'Default'
      - 'Unconfined'
  RedundantSuspendModifier:
    active: true
  SleepInsteadOfDelay:
    active: true
  SuspendFunInFinallySection:
    active: true # HEAPY: default false; suspend in finally must use NonCancellable
  SuspendFunSwallowedCancellation:
    active: true # HEAPY: default false; swallowing CancellationException breaks cancellation
  SuspendFunWithCoroutineScopeReceiver:
    active: true # HEAPY: default false; breaks structured concurrency
    aliases: ['SuspendFunctionOnCoroutineScope']
  SuspendFunWithFlowReturnType:
    active: true

empty-blocks:
  active: true
  EmptyCatchBlock:
    active: true
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  EmptyClassBlock:
    active: true
  EmptyDefaultConstructor:
    active: true
  EmptyDoWhileBlock:
    active: true
  EmptyElseBlock:
    active: true
  EmptyFinallyBlock:
    active: true
  EmptyForBlock:
    active: true
  EmptyFunctionBlock:
    active: true
    ignoreOverridden: false
  EmptyIfBlock:
    active: true
  EmptyInitBlock:
    active: true
  EmptyKotlinFile:
    active: true
  EmptySecondaryConstructor:
    active: true
  EmptyTryBlock:
    active: true
  EmptyWhenBlock:
    active: true
  EmptyWhileBlock:
    active: true

exceptions:
  active: true
  ErrorUsageWithThrowable:
    active: true # HEAPY: default false; error(e) drops the stacktrace
  ExceptionRaisedInUnexpectedLocation:
    active: true
    methodNames:
      - 'equals'
      - 'finalize'
      - 'hashCode'
      - 'toString'
  InstanceOfCheckForException:
    active: true
    excludes: [] # HEAPY: default excludes test sources; tests are held to the same rule
  NotImplementedDeclaration:
    active: true # HEAPY: default false; TODO() must not reach the main branch
  ObjectExtendsThrowable:
    active: true # HEAPY: default false; singleton exceptions share one stacktrace
  PrintStackTrace:
    active: true
  RethrowCaughtException:
    active: true
  ReturnFromFinally:
    active: true
    ignoreLabeled: false
  SwallowedException:
    active: true
    ignoredExceptionTypes:
      - 'InterruptedException'
      - 'MalformedURLException'
      - 'NumberFormatException'
      - 'ParseException'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  ThrowingExceptionFromFinally:
    active: true
  ThrowingExceptionInMain:
    active: false
  ThrowingExceptionsWithoutMessageOrCause:
    active: true
    excludes: [] # HEAPY: default excludes test sources; tests are held to the same rule
    exceptions:
      - 'ArrayIndexOutOfBoundsException'
      - 'Exception'
      - 'IllegalArgumentException'
      - 'IllegalMonitorStateException'
      - 'IllegalStateException'
      - 'IndexOutOfBoundsException'
      - 'NullPointerException'
      - 'RuntimeException'
      - 'Throwable'
  ThrowingNewInstanceOfSameException:
    active: true
  TooGenericExceptionCaught:
    active: true
    excludes: [] # HEAPY: default excludes test sources; tests are held to the same rule
    exceptionNames:
      - 'ArrayIndexOutOfBoundsException'
      - 'Error'
      - 'Exception'
      - 'IllegalMonitorStateException'
      - 'IndexOutOfBoundsException'
      - 'NullPointerException'
      - 'RuntimeException'
      - 'Throwable'
    allowedExceptionNameRegex: '_|(ignore|expected).*'
  TooGenericExceptionThrown:
    active: true
    exceptionNames:
      - 'Error'
      - 'Exception'
      - 'RuntimeException'
      - 'Throwable'

naming:
  active: true
  BooleanPropertyNaming:
    active: false
    allowedPattern: '^(is|has|are)'
  ClassNaming:
    active: true
    aliases: ['ClassName']
    classPattern: '[A-Z][a-zA-Z0-9]*'
  ConstructorParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    privateParameterPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'
  EnumNaming:
    active: true
    aliases: ['EnumEntryName']
    enumEntryPattern: '[A-Z][_a-zA-Z0-9]*'
  ForbiddenClassName:
    active: false
    forbiddenName: []
  FunctionNameMaxLength:
    active: false
    aliases: ['FunctionMaxNameLength']
    maximumFunctionNameLength: 30
  FunctionNameMinLength:
    active: false
    aliases: ['FunctionMinNameLength']
    minimumFunctionNameLength: 3
  FunctionNaming:
    active: true
    aliases: ['FunctionName']
    excludes: [] # HEAPY: default excludes test sources; tests are held to the same rule
    functionPattern: '[a-z][a-zA-Z0-9]*'
    excludeClassPattern: '$^'
  FunctionParameterNaming:
    active: true
    parameterPattern: '[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'
  InvalidPackageDeclaration:
    active: true
    aliases: ['PackageDirectoryMismatch']
    rootPackage: ''
    requireRootInDeclaration: false
  LambdaParameterNaming:
    active: false
    parameterPattern: '[a-z][A-Za-z0-9]*|_'
  MatchingDeclarationName:
    active: true
    mustBeFirst: true
    multiplatformTargets:
      - 'ios'
      - 'android'
      - 'js'
      - 'jvm'
      - 'native'
      - 'iosArm64'
      - 'iosX64'
      - 'macosX64'
      - 'mingwX64'
      - 'linuxX64'
  MemberNameEqualsClassName:
    active: true
    ignoreOverridden: true
  NoNameShadowing:
    active: true
  NonBooleanPropertyPrefixedWithIs:
    active: false
    allowSingleTypedGenerics: false
  ObjectPropertyNaming:
    active: true
    aliases: ['ObjectPropertyName']
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '(_)?[A-Za-z][_A-Za-z0-9]*'
  PackageNaming:
    active: true
    aliases: ['PackageName']
    packagePattern: '[a-z]+(\.[a-z][A-Za-z0-9]*)*'
  TopLevelPropertyNaming:
    active: true
    constantPattern: '[A-Z][_A-Z0-9]*'
    propertyPattern: '[A-Za-z][_A-Za-z0-9]*'
    privatePropertyPattern: '_?[A-Za-z][_A-Za-z0-9]*'
  VariableMaxLength:
    active: false
    maximumVariableNameLength: 64
  VariableMinLength:
    active: false
    minimumVariableNameLength: 1
  VariableNaming:
    active: true
    aliases: ['PropertyName']
    variablePattern: '[a-z][A-Za-z0-9]*'
    privateVariablePattern: '(_)?[a-z][A-Za-z0-9]*'
    excludeClassPattern: '$^'

performance:
  active: true
  ArrayPrimitive:
    active: true
  CouldBeSequence:
    active: false
    allowedOperations: 2
  ForEachOnRange:
    active: true
    excludes: [] # HEAPY: default excludes test sources; tests are held to the same rule
  SpreadOperator:
    active: true
    excludes: [] # HEAPY: default excludes test sources; tests are held to the same rule
  UnnecessaryInitOnArray:
    active: false
  UnnecessaryPartOfBinaryExpression:
    active: false
  UnnecessaryTemporaryInstantiation:
    active: true
  UnnecessaryTypeCasting:
    active: false

potential-bugs:
  active: true
  AvoidReferentialEquality:
    active: true
    forbiddenTypePatterns:
      - 'kotlin.String'
  CastNullableToNonNullableType:
    active: true # HEAPY: default false; 'as' on a nullable type is '!!' in disguise
    ignorePlatformTypes: true
  CastToNullableType:
    active: true # HEAPY: default false; use 'as?' instead
  CharArrayToStringCall:
    active: false
  Deprecation:
    active: false
    aliases: ['DEPRECATION']
  DontDowncastCollectionTypes:
    active: true # HEAPY: default false
  DoubleMutabilityForCollection:
    active: true
    aliases: ['DoubleMutability']
    mutableTypes:
      - 'kotlin.collections.MutableList'
      - 'kotlin.collections.MutableMap'
      - 'kotlin.collections.MutableSet'
      - 'java.util.ArrayList'
      - 'java.util.LinkedHashSet'
      - 'java.util.HashSet'
      - 'java.util.LinkedHashMap'
      - 'java.util.HashMap'
  ElseCaseInsteadOfExhaustiveWhen:
    active: true # HEAPY: default false; 'else' hides a new sealed/enum branch
    ignoredSubjectTypes: []
  EqualsAlwaysReturnsTrueOrFalse:
    active: true
  EqualsWithHashCodeExist:
    active: true
  ExitOutsideMain:
    active: false
  ExplicitGarbageCollectionCall:
    active: true
  HasPlatformType:
    active: true
  IgnoredReturnValue:
    active: true
    restrictToConfig: true
    returnValueAnnotations:
      - 'CheckResult'
      - '*.CheckResult'
      - 'CheckReturnValue'
      - '*.CheckReturnValue'
    ignoreReturnValueAnnotations:
      - 'CanIgnoreReturnValue'
      - '*.CanIgnoreReturnValue'
    returnValueTypes:
      - 'kotlin.Function*'
      - 'kotlin.sequences.Sequence'
      - 'kotlinx.coroutines.flow.*Flow'
      - 'java.util.stream.*Stream'
    ignoreFunctionCall: []
  ImplicitDefaultLocale:
    active: true
  ImplicitUnitReturnType:
    active: false
    ignoreAnnotated: ['Test']
    allowExplicitReturnType: true
  InvalidRange:
    active: true
  IteratorHasNextCallsNextMethod:
    active: true
  IteratorNotThrowingNoSuchElementException:
    active: true
  LateinitUsage:
    active: true # HEAPY: default false; 'lateinit' is the other way around null safety
    excludes: [] # HEAPY: default excludes test sources; 'lateinit' is banned everywhere, like '!!'
    ignoreOnClassesPattern: ''
  MapGetWithNotNullAssertionOperator:
    active: true
  MissingPackageDeclaration:
    active: true # HEAPY: default false
    excludes: ['**/*.kts']
  MissingSuperCall:
    active: false
    mustInvokeSuperAnnotations:
      - 'androidx.annotation.CallSuper'
      - 'javax.annotation.OverridingMethodsMustInvokeSuper'
  MissingUseCall:
    active: true # HEAPY: default false; a Closeable without use{} leaks
    ignoreClass:
      - 'java.io.ByteArrayInputStream'
      - 'java.io.ByteArrayOutputStream'
  NullCheckOnMutableProperty:
    active: true # HEAPY: default false; a null check on a 'var' gives no smart cast
  NullableToStringCall:
    active: true # HEAPY: default false; interpolating null prints the text "null"
  PropertyUsedBeforeDeclaration:
    active: true # HEAPY: default false; the property is null at that point
  UnconditionalJumpStatementInLoop:
    active: true # HEAPY: default false; the loop always exits on the first pass
  UnnamedParameterUse:
    active: true # HEAPY: default false
    allowAdjacentDifferentTypeParams: true
    allowSingleParamUse: true
    ignoreArgumentsMatchingNames: true
    ignoreFunctionCall: []
  UnnecessaryNotNullCheck:
    active: true # HEAPY: default false
  UnnecessaryNotNullOperator:
    active: true
  UnnecessarySafeCall:
    active: true
  UnreachableCatchBlock:
    active: true
  UnreachableCode:
    active: true
  UnsafeCallOnNullableType:
    active: true
    excludes: [] # HEAPY: default excludes test sources; '!!' is banned everywhere
  UnsafeCast:
    active: true
    aliases: ['UNCHECKED_CAST']
  UnusedUnaryOperator:
    active: true
  UselessPostfixExpression:
    active: true
  WrongEqualsTypeParameter:
    active: true

style:
  active: true
  AbstractClassCanBeConcreteClass:
    active: true
  AbstractClassCanBeInterface:
    active: true
    ignoreSealedClasses: false
  AlsoCouldBeApply:
    active: false
  BracesOnIfStatements:
    active: true # HEAPY: default false
    singleLine: 'consistent' # HEAPY: default 'never'; 'always' also hits 'fun f() = if (a) 1 else 2'
    multiLine: 'always'
  BracesOnWhenStatements:
    active: true # HEAPY: default false
    singleLine: 'necessary'
    multiLine: 'consistent'
  CanBeNonNullable:
    active: false
  CascadingCallWrapping:
    active: true # HEAPY: default false; if one call in a chain wraps, all of them wrap
    includeElvis: true
  ClassOrdering:
    active: true # HEAPY: default false
  CollapsibleIfStatements:
    active: false
  DataClassContainsFunctions:
    active: false
    conversionFunctionPrefix:
      - 'to'
    allowOperators: false
  DataClassShouldBeImmutable:
    active: true # HEAPY: default false; data classes are value carriers, use copy() instead of var
  DestructuringDeclarationWithTooManyEntries:
    active: true
    maxDestructuringEntries: 3
  DoubleNegativeExpression:
    active: true # HEAPY: default false
  DoubleNegativeLambda:
    active: false
    negativeFunctions:
      - reason: 'Use `takeIf` instead.'
        value: 'takeUnless'
      - reason: 'Use `all` instead.'
        value: 'none'
    negativeFunctionNameParts:
      - 'not'
      - 'non'
  EqualsNullCall:
    active: true
  EqualsOnSignatureLine:
    active: false
  ExplicitCollectionElementAccessMethod:
    active: false
  ExplicitItLambdaMultipleParameters:
    active: true
  ExplicitItLambdaParameter:
    active: true
  ExpressionBodySyntax:
    active: true # HEAPY: default false; a single-return function becomes '= expr'
    includeLineWrapping: false
  ForbiddenAnnotation:
    active: false
    annotations:
      - reason: 'it is a java annotation. Use `Suppress` instead.'
        value: 'java.lang.SuppressWarnings'
      - reason: 'it is a java annotation. Use `kotlin.Deprecated` instead.'
        value: 'java.lang.Deprecated'
      - reason: 'it is a java annotation. Use `kotlin.annotation.MustBeDocumented` instead.'
        value: 'java.lang.annotation.Documented'
      - reason: 'it is a java annotation. Use `kotlin.annotation.Target` instead.'
        value: 'java.lang.annotation.Target'
      - reason: 'it is a java annotation. Use `kotlin.annotation.Retention` instead.'
        value: 'java.lang.annotation.Retention'
      - reason: 'it is a java annotation. Use `kotlin.annotation.Repeatable` instead.'
        value: 'java.lang.annotation.Repeatable'
  ForbiddenComment:
    active: true
    comments: # HEAPY: default also forbids 'TODO:'; TODO comments are allowed, FIXME/STOPSHIP are not
      - reason: 'Forbidden FIXME todo marker in comment, please fix the problem.'
        value: 'FIXME:'
      - reason: 'Forbidden STOPSHIP todo marker in comment, please address the problem before shipping the code.'
        value: 'STOPSHIP:'
    allowedPatterns: ''
  ForbiddenImport:
    active: true # HEAPY: default false
    forbiddenImports: # HEAPY: default empty
      - reason: 'Date is mutable and not thread safe. Use java.time.Instant.'
        value: 'java.util.Date'
      - reason: 'Calendar is mutable and not thread safe. Use java.time.'
        value: 'java.util.Calendar'
      - reason: 'SimpleDateFormat is not thread safe. Use java.time.format.DateTimeFormatter.'
        value: 'java.text.SimpleDateFormat'
      - reason: 'A cast to a platform type hides a null. Model the nullability instead.'
        value: 'java.util.Optional'
    allowedImports: []
  ForbiddenMethodCall:
    active: true # HEAPY: default false
    methods:
      - reason: 'print does not allow you to configure the output stream. Use a logger instead.'
        value: 'kotlin.io.print'
      - reason: 'println does not allow you to configure the output stream. Use a logger instead.'
        value: 'kotlin.io.println'
      - reason: 'using `BigDecimal(Double)` can result in unexpected floating point precision behavior. Use `BigDecimal.valueOf(Double)` or `String.toBigDecimalOrNull()` instead.'
        value: 'java.math.BigDecimal.<init>(kotlin.Double)'
      - reason: 'using `BigDecimal(String)` can result in a `NumberFormatException`. Use `String.toBigDecimalOrNull()`'
        value: 'java.math.BigDecimal.<init>(kotlin.String)'
      - reason: 'It is marked as obsolete. Use `kotlin.time.measureTime` instead.'
        value: 'kotlin.system.measureTimeMillis'
      # HEAPY: everything below is added on top of the default list
      - reason: 'Thread.sleep blocks the thread. In a coroutine use delay instead.'
        value: 'java.lang.Thread.sleep'
      - reason: 'Reading the wall clock directly makes the code untestable. Inject a kotlin.time.Clock.'
        value: 'java.lang.System.currentTimeMillis'
      - reason: 'Reading the clock directly makes the code untestable. Inject a kotlin.time.Clock.'
        value: 'java.lang.System.nanoTime'
      - reason: 'now() reads a hidden global clock. Inject a kotlin.time.Clock.'
        value: 'java.time.Instant.now'
      - reason: 'now() reads a hidden global clock and the default time zone. Inject a kotlin.time.Clock.'
        value: 'java.time.LocalDate.now'
      - reason: 'now() reads a hidden global clock and the default time zone. Inject a kotlin.time.Clock.'
        value: 'java.time.LocalDateTime.now'
      - reason: 'now() reads a hidden global clock. Inject a kotlin.time.Clock.'
        value: 'java.time.ZonedDateTime.now'
      - reason: 'The result depends on the default locale. Pass a Locale, or use string templates.'
        value: 'java.lang.String.format(kotlin.String, kotlin.Array)'
      - reason: 'Every now() reads a hidden global clock. Inject a kotlin.time.Clock.'
        value: 'java.time.LocalTime.now'
      - reason: 'Every now() reads a hidden global clock. Inject a kotlin.time.Clock.'
        value: 'java.time.OffsetDateTime.now'
      - reason: 'Every now() reads a hidden global clock. Inject a kotlin.time.Clock.'
        value: 'java.time.OffsetTime.now'
      - reason: 'Every now() reads a hidden global clock. Inject a kotlin.time.Clock.'
        value: 'java.time.Year.now'
      - reason: 'Every now() reads a hidden global clock. Inject a kotlin.time.Clock.'
        value: 'java.time.YearMonth.now'
      - reason: 'Every now() reads a hidden global clock. Inject a kotlin.time.Clock.'
        value: 'java.time.MonthDay.now'
      - reason: 'The no-arg constructor reads the clock. Date(Long) is fine.'
        value: 'java.util.Date.<init>()'
      - reason: 'An unseeded random makes a test unrepeatable. Inject a kotlin.random.Random.'
        value: 'java.lang.Math.random'
      - reason: 'The no-arg constructor seeds itself. Random(Long) is fine.'
        value: 'java.util.Random.<init>()'
      - reason: 'A random id makes a test unrepeatable. Inject a generator.'
        value: 'java.util.UUID.randomUUID'
      - reason: 'Random.Default seeds itself. Inject a kotlin.random.Random, seeded in the test.'
        value: 'kotlin.random.Random.Default.nextInt'
      - reason: 'Random.Default seeds itself. Inject a kotlin.random.Random, seeded in the test.'
        value: 'kotlin.random.Random.Default.nextLong'
      - reason: 'Random.Default seeds itself. Inject a kotlin.random.Random, seeded in the test.'
        value: 'kotlin.random.Random.Default.nextDouble'
      - reason: 'Random.Default seeds itself. Inject a kotlin.random.Random, seeded in the test.'
        value: 'kotlin.random.Random.Default.nextFloat'
      - reason: 'Random.Default seeds itself. Inject a kotlin.random.Random, seeded in the test.'
        value: 'kotlin.random.Random.Default.nextBoolean'
      - reason: 'Random.Default seeds itself. Inject a kotlin.random.Random, seeded in the test.'
        value: 'kotlin.random.Random.Default.nextBytes'
      - reason: 'Random.Default seeds itself. Inject a kotlin.random.Random, seeded in the test.'
        value: 'kotlin.random.Random.Default.nextUInt'
      - reason: 'Random.Default seeds itself. Inject a kotlin.random.Random, seeded in the test.'
        value: 'kotlin.random.Random.Default.nextULong'
      - reason: 'Random.Default seeds itself. Inject a kotlin.random.Random, seeded in the test.'
        value: 'kotlin.random.Random.Default.nextUBytes'
  ForbiddenNamedParam:
    active: false
    methods: []
  ForbiddenOptIn:
    active: false
    markerClasses: []
  ForbiddenSuppress:
    active: true # HEAPY: default false; an empty 'rules' list forbids nothing, so every active rule is listed
    rules: # HEAPY: generated by tools/generate-forbidden-suppress.main.kts, do not edit by hand
      - 'ALL'
      - 'AbstractClassCanBeConcreteClass'
      - 'AbstractClassCanBeInterface'
      - 'All'
